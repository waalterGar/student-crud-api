spring.application.name=student-crud-api

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:5432/students_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Resiliency Settings
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=30000

# Flyway Migration Settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Swagger UI / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/api-docs

# Redis Configuration (Spring Boot auto-connects to the host/port defined here or via environment variables)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Mailpit Configuration
spring.mail.host=${SPRING_MAIL_HOST:mailpit}
spring.mail.port=${SPRING_MAIL_PORT:1025}

# RabbitMQ Notification Properties
app.rabbitmq.exchange=student.exchange
app.rabbitmq.queue=student.notification.queue
app.rabbitmq.email-queue=student.email.queue
app.rabbitmq.enrollment-queue=student.enrollment.queue
app.rabbitmq.routing-key=student.created
app.rabbitmq.enrollment-routing-key=student.enrollment.created
app.rabbitmq.unenrollment-routing-key=student.enrollment.cancelled
app.rabbitmq.grading-routing-key=student.enrollment.graded

# ===================================================================
# RabbitMQ Listener & Retry Policy Configuration
# ===================================================================
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000ms

# Important
spring.rabbitmq.listener.simple.default-requeue-rejected=false

